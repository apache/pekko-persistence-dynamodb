name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - release-*
      - 1.1.x
    tags-ignore: [ v.* ]

jobs:
  classify-pr:
    name: Classify root documentation changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout exact PR merge
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Prove that only existing root documentation files changed
        id: classify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          import subprocess

          allowed = {b"README.md", b"CONTRIBUTING.md"}

          def git(*args):
              return subprocess.check_output(("git", *args))

          def docs_only(before, after):
              # Raw NUL-separated records preserve filenames verbatim. No rename
              # detection means a rename is seen as an add/delete and cannot qualify.
              records = git("diff", "--raw", "-z", "--no-renames", "--no-ext-diff",
                            "--no-textconv", "--ignore-submodules=none", before, after, "--")
              if not records:
                  return False
              fields = records.split(b"\0")
              return fields.pop() == b"" and len(fields) % 2 == 0 and all(
                  path in allowed and metadata.split()[:2] == [b":100644", b"100644"]
                  and metadata.split()[-1] == b"M"
                  for metadata, path in zip(fields[::2], fields[1::2])
              )

          base, head, merge = (os.environ[name] for name in ("PR_BASE_SHA", "PR_HEAD_SHA", "GITHUB_SHA"))
          if all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head, merge)):
              parents = git("rev-list", "--parents", "-n", "1", merge).decode("ascii").split()
              if parents == [merge, base, head]:
                  merge_bases = git("merge-base", "--all", base, head).decode("ascii").split()
                  # Prove both the PR's own changes and the actual merge result. Any
                  # ambiguity, failure or absent proof leaves docs_only unset.
                  if len(merge_bases) == 1 and docs_only(merge_bases[0], head) and docs_only(base, merge):
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("docs_only=true\n")
          PYTHON

  check-code-style:
    name: Check Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Code style check
        run: sbt checkCodeStyle

  check-code-compilation:
    name: Check Code Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Compile all code with default compiler
        run: sbt "Test/compile"

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [check-code-compilation, classify-pr]
    if: >-
      ${{ always() && !cancelled() &&
          needs.check-code-compilation.result == 'success' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java-version: 17,  scala-version: 2.13, sbt-opts: '' }
          - { java-version: 17,  scala-version: 3.3, sbt-opts: '' }
          - { java-version: 17,  scala-version: 3.9, sbt-opts: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Run tests with Scala ${{ matrix.scala-version }} and Java ${{ matrix.java-version }}
        run: sbt "++${{ matrix.scala-version }} test" ${{ matrix.sbt-opts }}

      - name: Print logs on failure
        if: ${{ failure() }}
        run: find . -name "*.log" -exec ./scripts/cat-log.sh {} \;
